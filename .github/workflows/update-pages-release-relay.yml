name: Relay Legacy Release Feed Deployment

on:
  workflow_run:
    workflows: ['Publish Update Feed']
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  relay:
    # workflow_run loads this workflow from the default branch, so old release
    # tags do not need to be rewritten. Dispatch completions never relay again.
    if: >-
      github.event.repository.private == false &&
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Recover legacy release-triggered Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # New release workflows already dispatched; avoid a duplicate request.
          relayed=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq 'any(.jobs[]; .name == "request-deployment")')
          if [ "$relayed" = "true" ]; then
            echo "Release event already relayed by its workflow."
            exit 0
          fi
          gh api --method POST "repos/$REPOSITORY/actions/workflows/update-pages.yml/dispatches" \
            -f ref="$DEFAULT_BRANCH"
